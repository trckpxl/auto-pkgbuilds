
name: Build mpv-git

on:
  workflow_dispatch:
  push:
    paths:
      - 'mpv-git/**'
      - '.github/workflows/mpv-git.yml'

permissions:
  contents: read

concurrency:
  group: mpv-git-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        shell: bash
        run: |
          set -euo pipefail

          # Update Arch Linux.
          pacman -Syu --noconfirm

          # Install build dependencies.
          pacman -S --needed --noconfirm \
            git meson ninja cmake pkgconf \
            python python-jinja \
            lcms2 vulkan-icd-loader vulkan-headers \
            glslang shaderc libdovi xxhash \
            ladspa wayland-protocols \
            ffnvcodec-headers python-docutils

          # Create the build user.
          useradd -m builder

          printf 'builder ALL=(ALL:ALL) NOPASSWD: /usr/bin/pacman\n' \
            > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          visudo -cf /etc/sudoers.d/builder

          # Configure x86-64-v3.
          sed -i 's/-march=x86-64/-march=x86-64-v3/g' \
            /etc/makepkg.conf

          sed -i "s|^MAKEFLAGS=.*|MAKEFLAGS=\"-j$(nproc)\"|" \
            /etc/makepkg.conf

          install -d -o builder -g builder \
            "$GITHUB_WORKSPACE/packages"

          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build and install libplacebo
        shell: bash
        run: |
          set -euo pipefail

          # Clone libplacebo with its submodules.
          runuser -u builder -- git clone --recursive \
            https://code.videolan.org/videolan/libplacebo.git \
            /tmp/libplacebo

          # Configure and compile.
          runuser -u builder -- meson setup \
            /tmp/libplacebo/build \
            /tmp/libplacebo \
            --prefix=/usr \
            --buildtype=release \
            --wrap-mode=nodownload \
            -Dtests=false \
            -Dvulkan=enabled

          runuser -u builder -- meson compile \
            -C /tmp/libplacebo/build

          # Stage the installation.
          DESTDIR=/tmp/libplacebo-package \
            meson install -C /tmp/libplacebo/build

          # Create a package for pacman.
          install -d /tmp/libplacebo-package/var/lib/pacman/local

          pacman -S --needed --noconfirm pacman-contrib

          # Remove files installed directly by the previous approach.
          rm -rf /usr/include/libplacebo
          rm -f /usr/lib/libplacebo.so*
          rm -f /usr/lib/pkgconfig/libplacebo.pc

          # Use a temporary package recipe.
          cat > /tmp/libplacebo-package/.PKGINFO <<'PKGINFO'
          pkgname = libplacebo
          pkgbase = libplacebo
          pkgver = 7.387.0-1
          pkgdesc = GPU-accelerated video processing library
          url = https://code.videolan.org/videolan/libplacebo
          builddate = 0
          packager = GitHub Actions
          size = 0
          arch = x86_64
          license = LGPL-2.1-or-later
          PKGINFO

          echo "Package staging completed."

      - name: Build mpv-git
        shell: bash
        run: |
          set -euo pipefail

          runuser -u builder -- env \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -euo pipefail <<'BUILD'
          cd "$GITHUB_WORKSPACE/mpv-git"

          export PKGDEST="$GITHUB_WORKSPACE/packages"

          # Build without installing mpv-git.
          makepkg --syncdeps --noconfirm --clean
          BUILD

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mpv-git-x86-64-v3
          path: packages/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
